name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and unit tests
        run: ./gradlew --no-daemon clean build desktop:dist
      - name: Test loose and packaged assets with software OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew --no-daemon desktop:smokeTest desktop:smokeTestDist
      - uses: actions/upload-artifact@v4
        with:
          name: PhigrosRemake-desktop
          path: desktop/build/libs/PhigrosRemake.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            desktop/build/reports/
